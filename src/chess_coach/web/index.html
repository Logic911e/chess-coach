<!doctype html>
<html lang="en" data-theme="walnut">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Coach</title>
<link rel="stylesheet" href="/static/css/themes.css">
<link rel="stylesheet" href="/static/css/app.css">
<script>
// Apply the saved theme before first paint (no flash); the page works without localStorage.
try {
  var t = JSON.parse(localStorage.getItem("chesscoach.theme"));
  if (t === "walnut" || t === "slate" || t === "paper") document.documentElement.dataset.theme = t;
  if (JSON.parse(localStorage.getItem("chesscoach.studyMode")) === true) document.documentElement.dataset.study = "on";
} catch (e) {}
</script>
</head>
<body>
<header class="topbar">
  <h1>Chess Coach</h1>
  <span id="gameTitle" class="game-title">Pick a game</span>
  <span id="counter" class="counter"></span>
  <button type="button" id="gamesBtn" aria-haspopup="dialog" aria-controls="gamesOverlay">Games</button>
  <div class="topbar-tools">
    <div class="theme-switch" role="group" aria-label="Theme">
      <button type="button" data-theme-choice="walnut" aria-label="Walnut theme" title="Walnut"></button>
      <button type="button" data-theme-choice="slate" aria-label="Slate theme" title="Slate"></button>
      <button type="button" data-theme-choice="paper" aria-label="Paper theme" title="Paper"></button>
    </div>
    <button type="button" id="studyToggle" aria-pressed="false" title="Study mode: no sound, no motion">Study mode</button>
  </div>
</header>

<main id="stage">
  <div id="boardCol">
    <div id="boardWrap"></div>
    <nav class="nav" aria-label="Move navigation">
      <button type="button" id="prevKey" title="Previous key moment">&lsaquo; Key</button>
      <button type="button" id="first" aria-label="First move">&laquo;</button>
      <button type="button" id="prev" aria-label="Previous move">&lsaquo;</button>
      <div id="strip" title="Each bar is one move. Taller = more expected points lost."></div>
      <button type="button" id="next" aria-label="Next move">&rsaquo;</button>
      <button type="button" id="last" aria-label="Last move">&raquo;</button>
      <button type="button" id="nextKey" title="Next key moment">Key &rsaquo;</button>
      <button type="button" id="flip" title="Flip the board">Flip</button>
    </nav>
  </div>
  <section id="caption" class="caption" aria-live="polite">
    <div class="cap-head"><span id="moveName" class="move-name"></span><span id="labelPill"></span><span id="reasons"></span></div>
    <div id="happened" class="happened"></div>
    <div id="explainBox" class="explain-scroll"></div>
    <div class="cap-actions">
      <button type="button" id="guessBtn" disabled title="Guessing arrives in a later step">Guess first</button>
      <button type="button" id="engineBtn" aria-pressed="true">Show engine move</button>
      <button type="button" id="askBtn" aria-controls="chatDrawer" aria-expanded="false">Ask the coach</button>
      <span id="explainAct" class="explain-act"></span>
    </div>
  </section>
</main>

<div id="gamesOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="Games" hidden>
  <div class="overlay-card">
    <div class="overlay-head"><h2>Games</h2><button type="button" id="gamesClose" aria-label="Close games">Close</button></div>
    <ul id="gameList"></ul>
  </div>
</div>

<aside id="chatDrawer" class="drawer" aria-label="Ask the coach" aria-hidden="true" inert>
  <div class="overlay-head"><h2>Ask the coach</h2><button type="button" id="chatClose" aria-label="Close chat">Close</button></div>
  <div id="chatLog" class="chat-log"></div>
  <div class="note">Answers are checked for legal moves and piece squares only, so they can still contain mistakes.</div>
  <form id="chatForm"><input id="chatInput" type="text" placeholder="Ask about this position" disabled><button type="submit" disabled>Send</button></form>
</aside>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
